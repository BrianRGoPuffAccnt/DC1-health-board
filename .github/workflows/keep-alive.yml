name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DC1 Health Board
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://dc1-health-boardgit-dqsa5ixkpqbzfpgckhqrrj.streamlit.app/")
          echo "Response status: $status"
          if [ "$status" -ge 500 ]; then
            echo "App returned a server error ($status)"
            exit 1
          fi
