# Copy these values into Streamlit Community Cloud > App settings > Secrets.
# Do not commit a real .streamlit/secrets.toml file.

[gcp_service_account]
type = "service_account"
project_id = "your-google-cloud-project-id"
private_key_id = "your-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-google-cloud-project-id.iam.gserviceaccount.com"
client_id = "your-client-id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-google-cloud-project-id.iam.gserviceaccount.com"
universe_domain = "googleapis.com"

# Optional fallback for org-owned Sheets that cannot be shared with a service account.
# If this block is present, the app uses it before the service account block.
# Fill from a local authorized-user token created by the work Google account.
#
# [google_oauth]
# client_id = "your-oauth-client-id.apps.googleusercontent.com"
# client_secret = "your-oauth-client-secret"
# refresh_token = "your-refresh-token"
# token_uri = "https://oauth2.googleapis.com/token"
# account = "your.work.account@example.com"
# scopes = [
#   "https://www.googleapis.com/auth/spreadsheets.readonly",
#   "https://www.googleapis.com/auth/drive.metadata.readonly",
#   "https://www.googleapis.com/auth/drive.activity.readonly",
# ]

