# Copy these values into Streamlit Community Cloud > App settings > Secrets.
# Do not commit a real .streamlit/secrets.toml file.

[gcp_service_account]
type = "service_account"
project_id = "your-google-cloud-project-id"
private_key_id = "your-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-google-cloud-project-id.iam.gserviceaccount.com"
client_id = "your-client-id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-google-cloud-project-id.iam.gserviceaccount.com"
universe_domain = "googleapis.com"

[[google_sheets]]
tag = "SDT Schedule"
notes = "Standard Departure Times"
source_url = "https://docs.google.com/spreadsheets/d/YOUR_SDT_SHEET_ID/edit"

[[google_sheets]]
tag = "OB TO Tracker"
notes = "Outbound Tracker"
source_url = "https://docs.google.com/spreadsheets/d/YOUR_OB_TRACKER_SHEET_ID/edit"

[[google_sheets]]
tag = "Fill Rate"
notes = "Operations Fill Rate"
source_url = "https://docs.google.com/spreadsheets/d/YOUR_FILL_RATE_SHEET_ID/edit"

[[google_sheets]]
tag = "Carrier Mapping"
notes = "Market Information"
source_url = "https://docs.google.com/spreadsheets/d/YOUR_TRAINING_CHEAT_SHEET_ID/edit"
